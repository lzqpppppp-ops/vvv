name: Build File Picker APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/yamlpicker
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'YamlPicker'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.yamlpicker'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.yamlpicker'
                  minSdk 30
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application android:label="快捷文件选择器" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <provider android:name=".YamlProvider" android:authorities="com.example.yamlpicker.files"
                      android:exported="true" android:grantUriPermissions="true" />
                  <provider android:name=".YamlDocumentsProvider" android:authorities="com.example.yamlpicker.documents"
                      android:exported="true" android:grantUriPermissions="true"
                      android:permission="android.permission.MANAGE_DOCUMENTS">
                      <intent-filter>
                          <action android:name="android.content.action.DOCUMENTS_PROVIDER" />
                      </intent-filter>
                  </provider>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.GET_CONTENT" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.OPENABLE" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/yamlpicker/YamlProvider.java <<'EOF'
          package com.example.yamlpicker;
          import android.content.*;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;
          import android.os.*;
          import android.provider.OpenableColumns;
          import java.io.File;
          import java.io.FileNotFoundException;

          public class YamlProvider extends ContentProvider {
              static final String AUTHORITY = "com.example.yamlpicker.files";
              static File downloads() { return Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS); }
              static boolean supported(String name) {
                  if(name==null) return false;
                  String n=name.toLowerCase(java.util.Locale.ROOT);
                  return n.endsWith(".yaml") || n.endsWith(".yml") || n.endsWith(".md");
              }
              static String mime(String name) {
                  return name!=null && name.toLowerCase(java.util.Locale.ROOT).endsWith(".md")
                      ? "text/markdown" : "application/x-yaml";
              }
              static Uri uriFor(File f) { return new Uri.Builder().scheme("content").authority(AUTHORITY)
                  .appendPath(f.getName()).build(); }
              private File resolve(Uri uri) throws FileNotFoundException {
                  if (!AUTHORITY.equals(uri.getAuthority()) || uri.getPathSegments().size()!=1)
                      throw new FileNotFoundException("Invalid URI");
                  String name=uri.getLastPathSegment();
                  if (name==null || name.contains("/") || name.contains("\\") || !supported(name))
                      throw new FileNotFoundException("Unsupported file type");
                  File file=new File(downloads(),name);
                  if (!file.isFile()) throw new FileNotFoundException("File not found");
                  return file;
              }
              @Override public boolean onCreate() { return true; }
              @Override public String getType(Uri uri) { return mime(uri.getLastPathSegment()); }
              @Override public Cursor query(Uri uri,String[] projection,String selection,String[] args,String order) {
                  try {
                      File f=resolve(uri);
                      String[] cols=projection==null?new String[]{OpenableColumns.DISPLAY_NAME,OpenableColumns.SIZE}:projection;
                      MatrixCursor c=new MatrixCursor(cols); Object[] values=new Object[cols.length];
                      for(int i=0;i<cols.length;i++) {
                          if(OpenableColumns.DISPLAY_NAME.equals(cols[i])) values[i]=f.getName();
                          else if(OpenableColumns.SIZE.equals(cols[i])) values[i]=f.length();
                      }
                      c.addRow(values); return c;
                  } catch(FileNotFoundException e) { return null; }
              }
              @Override public ParcelFileDescriptor openFile(Uri uri,String mode) throws FileNotFoundException {
                  if (!"r".equals(mode)) throw new FileNotFoundException("Read only");
                  return ParcelFileDescriptor.open(resolve(uri),ParcelFileDescriptor.MODE_READ_ONLY);
              }
              @Override public Uri insert(Uri uri,ContentValues values) { throw new UnsupportedOperationException(); }
              @Override public int update(Uri uri,ContentValues values,String where,String[] args) { throw new UnsupportedOperationException(); }
              @Override public int delete(Uri uri,String where,String[] args) { throw new UnsupportedOperationException(); }
          }
          EOF
                    cat > app/src/main/java/com/example/yamlpicker/YamlDocumentsProvider.java <<'EOF'
          package com.example.yamlpicker;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.os.CancellationSignal;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.provider.DocumentsContract;
          import android.provider.DocumentsProvider;
          import java.io.File;
          import java.io.FileNotFoundException;
          import java.util.Locale;

          public class YamlDocumentsProvider extends DocumentsProvider {
              private static final String ROOT="yaml-downloads";
              private static final String[] ROOT_COLUMNS={
                  DocumentsContract.Root.COLUMN_ROOT_ID,
                  DocumentsContract.Root.COLUMN_DOCUMENT_ID,
                  DocumentsContract.Root.COLUMN_TITLE,
                  DocumentsContract.Root.COLUMN_FLAGS,
                  DocumentsContract.Root.COLUMN_MIME_TYPES,
                  DocumentsContract.Root.COLUMN_ICON};
              private static final String[] FILE_COLUMNS={
                  DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                  DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                  DocumentsContract.Document.COLUMN_MIME_TYPE,
                  DocumentsContract.Document.COLUMN_SIZE,
                  DocumentsContract.Document.COLUMN_LAST_MODIFIED,
                  DocumentsContract.Document.COLUMN_FLAGS};
              @Override public boolean onCreate(){return true;}
              @Override public Cursor queryRoots(String[] projection){
                  MatrixCursor c=new MatrixCursor(projection==null?ROOT_COLUMNS:projection);
                  MatrixCursor.RowBuilder r=c.newRow();
                  for(String col:c.getColumnNames()) {
                      if(col.equals(DocumentsContract.Root.COLUMN_ROOT_ID)) r.add(ROOT);
                      else if(col.equals(DocumentsContract.Root.COLUMN_DOCUMENT_ID)) r.add(ROOT);
                      else if(col.equals(DocumentsContract.Root.COLUMN_TITLE)) r.add("Download：YAML 与 MD");
                      else if(col.equals(DocumentsContract.Root.COLUMN_MIME_TYPES)) r.add("*/*");
                      else if(col.equals(DocumentsContract.Root.COLUMN_ICON)) r.add(android.R.drawable.ic_menu_save);
                      else if(col.equals(DocumentsContract.Root.COLUMN_FLAGS)) r.add(DocumentsContract.Root.FLAG_LOCAL_ONLY);
                      else r.add(null);
                  }
                  return c;
              }
              private File file(String id) throws FileNotFoundException {
                  if(id==null || id.contains("/") || id.contains("\\") || !YamlProvider.supported(id))
                      throw new FileNotFoundException("Invalid document ID");
                  File f=new File(YamlProvider.downloads(),id);
                  if(!f.isFile()) throw new FileNotFoundException("Missing file");
                  return f;
              }
              private void add(MatrixCursor c,String id,File f) {
                  MatrixCursor.RowBuilder r=c.newRow();
                  for(String col:c.getColumnNames()) {
                      if(col.equals(DocumentsContract.Document.COLUMN_DOCUMENT_ID)) r.add(id);
                      else if(col.equals(DocumentsContract.Document.COLUMN_DISPLAY_NAME)) r.add(f==null?"YAML 与 MD 文件":f.getName());
                      else if(col.equals(DocumentsContract.Document.COLUMN_MIME_TYPE)) r.add(f==null?DocumentsContract.Document.MIME_TYPE_DIR:YamlProvider.mime(f.getName()));
                      else if(col.equals(DocumentsContract.Document.COLUMN_SIZE)) r.add(f==null?0:f.length());
                      else if(col.equals(DocumentsContract.Document.COLUMN_LAST_MODIFIED)) r.add(f==null?0:f.lastModified());
                      else if(col.equals(DocumentsContract.Document.COLUMN_FLAGS)) r.add(0);
                      else r.add(null);
                  }
              }
              @Override public Cursor queryDocument(String id,String[] projection) throws FileNotFoundException {
                  MatrixCursor c=new MatrixCursor(projection==null?FILE_COLUMNS:projection);
                  add(c,id,ROOT.equals(id)?null:file(id)); return c;
              }
              @Override public Cursor queryChildDocuments(String parent,String[] projection,String sortOrder) throws FileNotFoundException {
                  if(!ROOT.equals(parent)) throw new FileNotFoundException("Invalid folder");
                  MatrixCursor c=new MatrixCursor(projection==null?FILE_COLUMNS:projection);
                  File[] files=YamlProvider.downloads().listFiles(f->f.isFile() && YamlProvider.supported(f.getName()));
                  if(files!=null) for(File f:files) add(c,f.getName(),f);
                  return c;
              }
              @Override public ParcelFileDescriptor openDocument(String id,String mode,CancellationSignal signal) throws FileNotFoundException {
                  if(!"r".equals(mode)) throw new FileNotFoundException("Read only");
                  return ParcelFileDescriptor.open(file(id),ParcelFileDescriptor.MODE_READ_ONLY);
              }
          }
          EOF
          cat > app/src/main/java/com/example/yamlpicker/MainActivity.java <<'EOF'
          package com.example.yamlpicker;
          import android.app.*;
          import android.content.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;
          import java.io.File;
          import java.util.*;
          import java.util.regex.*;

          public class MainActivity extends Activity {
              private final File dir=YamlProvider.downloads();
              private final Handler handler=new Handler(Looper.getMainLooper());
              private FileObserver observer;
              private LinearLayout list;
              private TextView hint;
              private boolean picking;
              private final Runnable settle=this::cleanAndShow;
              private static final Pattern COLLISION=Pattern.compile("^(.*) \\(([1-9][0-9]*)\\)(\\.(?:yaml|yml|md))$",Pattern.CASE_INSENSITIVE);
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  picking=Intent.ACTION_GET_CONTENT.equals(getIntent().getAction());
                  LinearLayout base=new LinearLayout(this); base.setOrientation(LinearLayout.VERTICAL);
                  base.setPadding(20,20,20,20); setContentView(base);
                  TextView title=new TextView(this); title.setText("选择 Download 中的 YAML / YML / MD 文件"); title.setTextSize(21);
                  base.addView(title);
                  hint=new TextView(this); hint.setPadding(0,14,0,14); base.addView(hint);
                  Button refresh=new Button(this); refresh.setText("刷新文件列表"); refresh.setOnClickListener(v->cleanAndShow()); base.addView(refresh);
                  ScrollView scroll=new ScrollView(this); list=new LinearLayout(this); list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list); base.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                  if (!Environment.isExternalStorageManager()) requestPermission(); else cleanAndShow();
              }
              @Override public void onResume() {
                  super.onResume();
                  if(Environment.isExternalStorageManager()) {
                      if(observer==null) {
                          observer=new FileObserver(dir.getAbsolutePath(),FileObserver.CLOSE_WRITE|FileObserver.MOVED_TO|FileObserver.CREATE) {
                              @Override public void onEvent(int event,String path) {
                                  if(path!=null && YamlProvider.supported(path)) {
                                      handler.removeCallbacks(settle); handler.postDelayed(settle,1500);
                                  }
                              }
                          }; observer.startWatching();
                      }
                      cleanAndShow();
                  }
              }
              @Override public void onPause() {
                  if(observer!=null) { observer.stopWatching(); observer=null; }
                  handler.removeCallbacks(settle); super.onPause();
              }
              private void requestPermission() {
                  hint.setText("请授予“所有文件访问权限”，用于读取和清理 Download 中的 YAML 与 MD 文件。");
                  Button grant=new Button(this); grant.setText("授予文件访问权限");
                  grant.setOnClickListener(v->{
                      try { startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                          Uri.parse("package:"+getPackageName()))); }
                      catch(Exception e) { startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)); }
                  }); list.removeAllViews(); list.addView(grant);
              }
              private static String logicalName(String filename) {
                  Matcher m=COLLISION.matcher(filename);
                  return m.matches()?m.group(1)+m.group(3):filename;
              }
              private void cleanAndShow() {
                  if(!Environment.isExternalStorageManager()) { requestPermission(); return; }
                  File[] found=dir.listFiles(f->f.isFile() && YamlProvider.supported(f.getName()));
                  if(found==null) { hint.setText("无法读取 Download 文件夹"); return; }
                  Map<String,List<File>> groups=new HashMap<>();
                  for(File f:found) groups.computeIfAbsent(logicalName(f.getName()).toLowerCase(Locale.ROOT),k->new ArrayList<>()).add(f);
                  int removed=0;
                  for(List<File> group:groups.values()) if(group.size()>1) {
                      group.sort((a,b)->Long.compare(b.lastModified(),a.lastModified()));
                      File newest=group.get(0);
                      for(int j=1;j<group.size();j++) if(group.get(j).delete()) removed++;
                      String canonical=logicalName(newest.getName());
                      File destination=new File(dir,canonical);
                      if(!newest.equals(destination) && !destination.exists()) newest.renameTo(destination);
                  }
                  File[] files=dir.listFiles(f->f.isFile() && YamlProvider.supported(f.getName()));
                  if(files==null) files=new File[0];
                  Arrays.sort(files,(a,b)->Long.compare(b.lastModified(),a.lastModified()));
                  list.removeAllViews();
                  hint.setText("仅显示 Download 中的 .yaml / .yml / .md · "+files.length+" 个"+(removed>0?" · 清理旧版 "+removed+" 个":""));
                  if(files.length==0) { TextView empty=new TextView(this); empty.setText("没有找到 YAML 或 MD 文件"); list.addView(empty); }
                  for(File f:files) {
                      Button item=new Button(this); item.setAllCaps(false);
                      item.setText(f.getName()+"  ("+f.length()+" B)");
                      item.setOnClickListener(v->{
                          if(!picking) { Toast.makeText(this,"请从 Chrome 的 Choose your file 打开此选择器",Toast.LENGTH_LONG).show(); return; }
                          Uri u=YamlProvider.uriFor(f);
                          Intent result=new Intent().setDataAndType(u,YamlProvider.mime(f.getName()))
                              .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          result.setClipData(ClipData.newUri(getContentResolver(),f.getName(),u));
                          setResult(RESULT_OK,result); finish();
                      }); list.addView(item);
                  }
              }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FilePicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
